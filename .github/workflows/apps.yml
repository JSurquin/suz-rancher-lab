name: apps

on:
  push:
    branches: [main]
    paths:
      - lab/apps/**
      - .github/workflows/apps.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: java-demo
            context: lab/apps/java-demo
          - name: nextjs-demo
            context: lab/apps/nextjs-demo
          - name: node-api
            context: lab/apps/node-api
          - name: python-api
            context: lab/apps/python-api
    steps:
      - name: Code
        uses: actions/checkout@v7

      - name: QEMU
        uses: docker/setup-qemu-action@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=1.0
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
