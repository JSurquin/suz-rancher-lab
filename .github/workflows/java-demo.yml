name: java-demo

on:
  push:
    branches: [main]
    paths:
      - lab/apps/java-demo/**
      - .github/workflows/java-demo.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publier sur GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Code
        uses: actions/checkout@v7

      - name: QEMU
        uses: docker/setup-qemu-action@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/java-demo
          tags: |
            type=raw,value=1.0
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Image
        uses: docker/build-push-action@v7
        with:
          context: lab/apps/java-demo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Paquet public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          for _ in 1 2 3 4 5 6; do
            if gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/java-demo" \
              -f visibility=public; then
              exit 0
            fi
            sleep 5
          done
          echo "Le paquet reste privé pour l'instant." >&2
          exit 1
