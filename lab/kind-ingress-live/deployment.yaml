apiVersion: apps/v1
kind: Deployment
metadata:
  name: mon-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mon-nginx
  template:
    metadata:
      labels:
        app: mon-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
