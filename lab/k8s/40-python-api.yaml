apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-api
  namespace: suz-rancher-lab
  labels:
    app: python-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-api
  template:
    metadata:
      labels:
        app: python-api
    spec:
      containers:
        - name: python-api
          image: suz-rancher/python-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: python-api
  namespace: suz-rancher-lab
spec:
  selector:
    app: python-api
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
