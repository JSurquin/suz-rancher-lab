apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-api
  namespace: suz-rancher-lab
  labels:
    app: node-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-api
  template:
    metadata:
      labels:
        app: node-api
    spec:
      containers:
        - name: node-api
          image: suz-rancher/node-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: node-api
  namespace: suz-rancher-lab
spec:
  selector:
    app: node-api
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
