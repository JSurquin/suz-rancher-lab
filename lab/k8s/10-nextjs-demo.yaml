apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-demo
  namespace: suz-rancher-lab
  labels:
    app: nextjs-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextjs-demo
  template:
    metadata:
      labels:
        app: nextjs-demo
    spec:
      containers:
        - name: nextjs-demo
          image: suz-rancher/nextjs-demo:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: nextjs-demo
  namespace: suz-rancher-lab
spec:
  selector:
    app: nextjs-demo
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
