apiVersion: v1
kind: Service
metadata:
  name: nextjs-demo-nodeport
  namespace: suz-rancher-lab
spec:
  selector:
    app: nextjs-demo
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30000
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: java-demo-nodeport
  namespace: suz-rancher-lab
spec:
  selector:
    app: java-demo
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: node-api-nodeport
  namespace: suz-rancher-lab
spec:
  selector:
    app: node-api
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: python-api-nodeport
  namespace: suz-rancher-lab
spec:
  selector:
    app: python-api
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
  type: NodePort
